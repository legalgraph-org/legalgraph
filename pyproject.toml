[project]
name = "legalgraph"
version = "0.1.0"
description = "Utilities to load, validate, query and export legalgraph"
readme = "README.md"
license = "MIT"
authors = [{ name = "Aimix GmbH" }]
requires-python = "~=3.15.0"
dependencies = [
    "beautifulsoup4==4.15.0",
    "click==8.5.0",
    "lxml==6.1.3",
    "pydantic==2.14.3",
    "pypdf==6.1.3",
    "pyshacl==0.40.2",
    "python-dotenv==1.2.4",
    "pyyaml==6.0.3",
    "rdflib==7.6.0",
]

[project.scripts]
legalgraph = "legalgraph.cli:cli"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.3",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"
module-name = "legalgraph"

[tool.ruff]
target-version = "py315"
line-length = 120
exclude = [".venv", "__pycache__", ".git", ".pytest_cache", ".ruff_cache"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # Pyflakes
    "UP",      # pyupgrade
    "B",       # flake8-bugbear
    "SIM",     # flake8-simplify
    "I",       # isort
    "TID",     # flake8-tidy-imports
    "C90",     # mccabe: cyclomatic complexity
    "PL",      # Pylint: too many branches, returns, arguments, statements; import placement
    "N",       # pep8-naming
    "RET",     # flake8-return
    "C4",      # flake8-comprehensions
    "PIE",     # flake8-pie
    "PERF",    # Perflint
    "PTH",     # flake8-use-pathlib
    "ARG",     # flake8-unused-arguments
    "RUF",     # Ruff-specific
    "T20",     # no print(): the CLI writes through click
    "ERA",     # no commented-out code
]
ignore = [
    "PLR2004",                     # magic values: the parsers compare against portal formats by design
    "RUF001", "RUF002", "RUF003",  # law texts and their comments use typographic quotes and dashes
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG001"]  # pytest fixtures are requested by parameter name

# A function with more paths than this is split into named steps.
[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 6
max-branches = 12
max-returns = 6
max-statements = 50

# First-party imports must be absolute, e.g. `from legalgraph.load import Sources`.
[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-v", "--no-header", "-m", "not live"]
python_files = ["test_*.py"]
markers = [
    "live: queries the official legal portals over the network (run with -m live)",
]
