name: German online shop selling to consumers in Germany and the UK
description: >
  A GmbH selling online to consumers at home and in the UK. German law follows its establishment
  (Impressum, contract terms, dispute resolution statement) and its German customers. For its UK
  customers it gets UK consumer-contract rules and the UK GDPR, with a UK representative, because it
  offers goods to people in the UK.
