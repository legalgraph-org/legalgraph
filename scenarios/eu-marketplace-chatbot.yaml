name: German marketplace with ads and a chatbot
description: >
  A GmbH with 120 employees running an online marketplace where third-party traders sell to
  consumers, showing targeted ads to users and offering an AI support chatbot. It does not sell
  itself, sets marketing cookies with consent and transfers data to a US cloud provider.
