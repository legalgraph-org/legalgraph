name: Austrian GmbH with an online shop
description: >
  A GmbH in the Austrian commercial register (Firmenbuch) with a VAT ID, selling to consumers in
  Austria and Germany through its shop, with analytics cookies after consent. Austria's cookie rule is § 165(3) TKG 2021 — the ePrivacy
  duty as transposed. Its imprint follows
  the e-Commerce Directive as transposed in Austria (§ 5 ECG), not German law: the Directive's
  country-of-origin principle points to the place of establishment.
