name: Swiss online shop using a US analytics tool
description: >
  An AG established in Switzerland selling to customers in Switzerland and the EU, with US-based
  analytics behind a consent banner. The Swiss Data Protection Act applies; so does the GDPR, because
  it offers goods to people in the EU (and it would need an EU representative).
established_in: CH
markets: [EU]
