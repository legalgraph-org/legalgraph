name: Small German shop that takes part in consumer arbitration
description: >
  A sole trader with five employees selling to consumers, who has agreed to take part in proceedings
  before the Universalschlichtungsstelle. Small businesses are exempt from the statement of § 36(1)
  no. 1 VSBG, but once they take part they must name the arbitration board. As a
  microenterprise it is also exempt from the accessibility requirements of the BFSG.
