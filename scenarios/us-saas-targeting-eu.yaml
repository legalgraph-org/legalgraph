name: US software company selling to customers in the EU
description: >
  A company established only in the United States that sells a subscription to customers in the EU,
  tracks product usage, and relies on consent for marketing cookies. German law does not apply to it;
  the GDPR does (Article 3(2)), so it needs a representative in the EU.
established_in: US
