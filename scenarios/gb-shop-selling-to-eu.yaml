name: UK online shop selling to consumers in the UK and Germany
description: >
  A UK limited company selling online to consumers at home and in Germany, with analytics cookies
  after consent. UK law follows its establishment (website information, company disclosures, cookies
  under PECR) and its UK customers (consumer contracts, UK GDPR). For its German customers it gets
  German consumer-contract law (Article 6 Rome I), the German cookie rule (§ 1(3) TDDDG) and the
  GDPR with an EU representative: since Brexit the UK is a third country.
