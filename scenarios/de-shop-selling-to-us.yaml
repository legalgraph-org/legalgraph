name: German subscription shop selling to consumers in California
description: >
  A GmbH selling subscriptions online at home and to consumers in California, and sending marketing
  email to US addresses. German and EU law follow its establishment and German customers. California
  adds its online-seller notice and the automatic renewal law; CAN-SPAM covers the commercial email.
  Below the CCPA thresholds, the CCPA does not apply.
