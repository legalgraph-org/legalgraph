name: US online shop selling to consumers in Germany and France
description: >
  A US company without an establishment in the EU, selling online to consumers in Germany and
  France, with analytics cookies after consent and US hosting. Its consumer contracts follow German
  and French law (Article 6 Rome I), so it gets the German order button, withdrawal function and
  pre-contract list, and the French ones; the EU pre-contract rule stays for France, where the graph
  has no refining rule. The GDPR applies because it offers goods to people in the EU, with an EU
  representative. The German cookie rule applies because it provides services in Germany (§ 1(3)
  TDDDG). Provider information (Impressum) follows the e-Commerce Directive, which covers providers
  established in the EEA, so the graph gives none.
