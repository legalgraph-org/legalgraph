name: German GmbH with an online shop
description: >
  A GmbH entered in the commercial register, selling to consumers through its shop, with 30
  employees of whom 25 work with customer data, selling food and cosmetics by weight and volume, a VAT ID, only strictly necessary cookies (cart,
  login), and advertising emails to existing customers only. It does not take part in consumer
  arbitration.
