# Apache Shiro configuration for the local Fuseki in docker-compose.yml: no login, because the
# port is bound to 127.0.0.1 and the dataset is read-only and in memory (rebuilt on every start).
# Do not expose this setup on a network.
[main]
plainMatcher=org.apache.shiro.authc.credential.SimpleCredentialsMatcher

[urls]
/** = anon
