# Patērētāju tiesību aizsardzības likums, 19.1 pants: the Latvian trader ADR
# information duty — Directive 2013/11 Art. 13 transposition. (1) the seller
# or service provider informs the consumer about one or more out-of-court
# dispute resolvers on the PTAC-published list competent for the sector,
# including the resolver's website address; (2) the information is given
# clearly and accessibly on the trader's own website (if any) or in contract
# terms; (3) is the after-complaint analogue — when the trader refuses the
# consumer's claim during the dispute it gives the (1) information in writing
# or on another durable medium; (4) preserves other statutory information
# requirements.
