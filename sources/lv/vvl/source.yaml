# Valsts valodas likums (State Language Law): 21. pants is the Latvian
# language-in-public-information duty. Part 1 requires public information to
# be in the state language for state, municipal and majority-state-owned
# bodies, and for private entities performing public functions; parts 2–4
# extend it to product labelling/manuals, imported goods' translations, and
# signs/notices addressed to the public that touch legitimate public
# interests (consumer rights included, per 8. pants(2)); part 7 requires the
# Latvian text to take the primary place and not be narrower than the foreign
# text.
