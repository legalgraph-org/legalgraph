# Likums "Par presi un citiem masu informācijas līdzekļiem", 5.1 pants:
# the media-service-provider transparency duty inserted by the
# 11.06.2026 amendment (in force 27.06.2026). The provider must make the
# Article 6(1) European Media Freedom Act information easily and directly
# accessible to recipients of its services and keep it updated, for
# example on its website — it reaches websites expressly. The article
# references EMFA art. 6(1) for the item list rather than restating it.
