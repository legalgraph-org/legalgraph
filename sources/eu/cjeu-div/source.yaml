# Case C-298/07, Bundesverband der Verbraucherzentralen und Verbraucherverbaende v deutsche internet
# versicherung AG, judgment of 16 October 2008 (Fourth Chamber): Article 5(1)(c) of the E-Commerce
# Directive requires "details which allow the service provider to be contacted rapidly and communicated
# with in a direct and effective manner" — not necessarily a telephone number; an online enquiry form
# answered by email suffices (save the rare no-network-access case). EUR-Lex offers no Formex XML for
# this 2008 judgment; the operative part is transcribed from the official ECR PDF.
