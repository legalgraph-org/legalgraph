# Directive (EU) 2015/1535 (Single Market Transparency Directive), Official Journal text (Formex 4)
# from Cellar. Held for the definition of an information society service in Article 1(1)(b), "any
# service normally provided for remuneration, at a distance, by electronic means and at the individual
# request of a recipient of services", which the e-Commerce Directive's Article 2(a) uses: it points to
# Directive 98/34/EC, and Article 10 reads references to that repealed directive as references to this one.
