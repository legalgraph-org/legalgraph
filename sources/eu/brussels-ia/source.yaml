# Regulation (EU) No 1215/2012 on jurisdiction and the recognition and enforcement of
# judgments (Brussels Ia), the text in force. Articles 17 to 19 protect the consumer in
# jurisdiction clauses: the consumer may sue at home and can only be sued there, and a forum
# clause is valid only in narrow cases — relevant to jurisdiction clauses in website terms.
