# e-Commerce Directive (2000/31/EC): recital 18 and the definitions in Article 2(a) and (c), from the
# authentic Official Journal text (HTML, in ../ecommerce/). Recitals are left out of consolidated texts,
# and the consolidated XML's definition list cannot be compared line by line with the Official Journal,
# so these are transcribed in schemas/law.xsd and `legalgraph sources verify` checks each, word for
# word, against the HTML. Recital 18 explains that services financed by advertising rather than by
# the recipient are information society services too; Article 2(a) points to the definition now in
# Directive (EU) 2015/1535 (../single-market-transparency/).
