# applying from 12 August 2022, from the Publications Office (Formex 4). Article 26, substituted
# by Directive (EU) 2019/1151, requires companies to publish the company-law particulars on their
# websites — the EU basis for the imprint of registered companies. The consolidated text is a
# documentation tool: the authentic texts are the OJ publications of the directive and of the
# 2019 amendment, kept here for the quoted provisions (`amends`). English is annotated; German is
# a parallel language version.
