# Regulation (EU) 2023/2854 (Data Act): fair access to and use of data. Chapter VI (arts. 23-29)
# is what matters for a platform holding a customer's evidence: providers of data-processing
# services must remove obstacles to switching — including effective and functional data export —
# and may not charge switching fees once the transitional period ends (12 January 2027).
# Official Journal text, English with the German parallel.
