# Judgment of the Court of Justice of the EU, Case C-330/23 (Aldi Süd), 26 September 2024:
# Article 6a(1)-(2) of Directive 98/6/EC requires an announced price reduction (percentage or
# promotional claim) to be *determined on the basis of* the prior price — the lowest price of
# the last 30 days — so the reduced price cannot be equal to or higher than that prior price.
# This is the ruling behind Germany's PAngV § 11 "30-day rule" for "was/now" price claims.
# ECLI:EU:C:2024:804. The language of the case is German; English is the Court's translation,
# annotated for its operative part.
