# Directive 2013/11/EU on alternative dispute resolution for consumer disputes (consumer ADR
# Directive), from the Publications Office (Formex 4). Article 13 requires traders committed or
# obliged to use an ADR entity to name it on their websites and in their general terms — the EU
# basis for the ADR part of the imprint (Germany: §§ 36, 37 VSBG). Never amended: Regulation (EU)
# 2024/3228 repealed only the ODR platform Regulation and amended Regulations 2017/2394 and
# 2018/1724, not this Directive. English is annotated; German is a parallel language version.
