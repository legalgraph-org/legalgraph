# Judgment in Case C-649/17, Bundesverband der Verbraucherzentralen (BKK v Amazon EU Sàrl), 10 July 2019:
# Article 6(1)(c) of the Consumer Rights Directive does not let national law demand a telephone number
# in all circumstances: a trader need only communicate the means of contact it actually has (ruling 1)
# and may offer other means than those listed if they allow direct and effective communication
# (ruling 2); whether Amazon's callback service met that standard was left to the national court.
# The ruling reads the wording before Directive (EU) 2019/2161; since 28 May 2022 the provision lists
# the trader's telephone number and email address. The language of the case, German, is the authentic
# version; the English text is the Court's translation. Both operative paragraphs are annotated.
