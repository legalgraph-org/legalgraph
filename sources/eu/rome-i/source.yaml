# Regulation (EC) No 593/2008 on the law applicable to contractual obligations (Rome I),
# Official Journal text — unamended for the provisions quoted. Article 6(2) says a choice of
# law in consumer contracts cannot deprive the consumer of the protection of their home
# country's mandatory rules: the provision against choice-of-law clauses that strip consumer
# rights. English is annotated; German is a parallel language version.
