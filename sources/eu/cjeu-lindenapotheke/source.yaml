# Judgment of the Court of Justice of the EU, Case C-21/23 (Lindenapotheke), 4 October 2024:
# competitors may invoke GDPR breaches against each other under national unfair-competition
# law — the GDPR does not exclude civil actions by competitors. This is the ruling behind the
# "a German Abmahnung can enforce privacy duties" claim. ECLI:EU:C:2024:846. The language of
# the case is German; English is the Court's translation, annotated for its operative part.
