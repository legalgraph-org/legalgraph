# Zákon č. 634/1992 Sb., o ochraně spotřebitele, § 14: the trader ADR
# information duty — Directive 2013/11 Art. 13 transposition. (1) names the
# competent out-of-court consumer-dispute entity plus its internet address,
# on the trader's website and in the business terms the contract refers to;
# (2) is the after-complaint duty in paper or another durable medium.
