# Zákon č. 480/2004 Sb., o některých službách informační společnosti: the Czech
# e-Commerce act. §§ 3–6 are the intermediary safe harbours; the act has no
# ECD-Art.5 provider-information list — the Czech identification duties live in
# § 435(1) občanský zákoník (already sourced). § 7 is the commercial-
# communications regime (opt-in, soft opt-in, marking, sender identity,
# opt-out address) and § 8(3) is the regulated-profession fragment of Art. 5:
# professional chamber name, professional rules, and permanent public access
# to chamber information in commercial communications.
