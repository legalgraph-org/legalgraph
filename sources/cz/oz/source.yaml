# Občanský zákoník, zákon č. 89/2012 Sb.: § 435 is the Czech business-letter
# and remote-access disclosure duty — every entrepreneur must give name and
# seat on business letters and in information published by remote access
# (i.e. the website), plus the register-entry particulars and the IČ where
# assigned. The text is transcribed from the consolidated version on
# zakonyprolidi.cz (the official e-Sbírka is a client-side app).
