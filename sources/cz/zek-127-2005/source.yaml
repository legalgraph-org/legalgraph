# Zákon č. 127/2005 Sb., o elektronických komunikacích (ZEK): § 89 odst. 3 is
# the storage-and-access rule — the Czech transposition of ePrivacy Directive
# art. 5(3), on the consent model ("prokazatelný souhlas" = demonstrable
# consent). Consent must cover the scope and purpose of the processing; the
# second sentence excepts transmission-only storage/access and access
# strictly necessary for an expressly requested information-society service.
# e-Sbírka is a JavaScript application; tools/render renders it.
