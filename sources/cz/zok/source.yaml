# Zákon o obchodních korporacích, zákon č. 90/2012 Sb.: § 7 is the Czech
# company-law website duty — a stated share capital on business letters must
# be the subscribed paid-in part (odst. 1); a joint-stock company must run a
# free public website carrying the business-letter particulars (odst. 2); a
# s.r.o. website gets the same treatment (odst. 3); foreign branches
# likewise (odst. 4). Transcribed from zakonyprolidi.cz.
