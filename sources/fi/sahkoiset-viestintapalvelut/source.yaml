# Laki sähköisen viestinnän palveluista (917/2014), § 176: the general information duty —
# tietoyhteiskunnan palvelun tarjoaja keeps provider name, geographic address in the state of
# establishment, e-mail and other rapid direct effective contact details, public-register entry
# and business/organisation identifier, supervisory-authority contact where a licence or
# registration is required, VAT identifier where applicable, and for regulated professions the
# professional body, title, member state, and the professional rules — easily, directly and
# continuously available to recipients and authorities. This is Finland's transposition of
# e-Commerce Directive Art. 5. finlex.fi builds the consolidated act with JavaScript; tools/render
# renders it (make render-install once).
