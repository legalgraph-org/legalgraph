# Zákon č. 391/2015 Z. z. o alternatívnom riešení spotrebiteľských sporov,
# § 11: the Slovak after-complaint ADR duty — Directive 2013/11 Art. 13(3)
# transposition. When the trader answers the consumer's remedy request
# under (1) negatively, (2) obliges it to inform the consumer about the
# competent ADR entities on a durable medium. Slovakia has no separate
# proactive website/contract-terms paragraph in this act; the pre-contract
# notice sits in zákon 108/2024 Z. z. § 5(1)(l) (sources/sk/zos-108).
