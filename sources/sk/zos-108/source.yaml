# Zákon č. 108/2024 Z. z. o ochrane spotrebiteľa, § 5(1)(l): part of the
# pre-contract information list — the trader must give the consumer a notice
# about the right to submit a remedy request under the special act
# (391/2015) together with a link to the website where information about
# the competent ADR entity is published. It is the closest Slovak analogue
# of Directive 2013/11 Art. 13(1)–(2); it is not a standalone website duty
# (the whole list applies at contract conclusion, so it reaches websites
# only through the general e-commerce/CRD route).
