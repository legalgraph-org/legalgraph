# Zákon č. 265/2022 Z. z. o vydavateľoch publikácií a o registri v oblasti
# médií a audiovízie a o zmene a doplnení niektorých zákonov (zákon o
# publikáciách), § 5: the mandatory-data duty for periodical publications.
# § 5(3) reaches websites — a news web portal operator must mark the portal
# with the publication name and communication publication/update dates and
# carry the operator data of § 5(1)(d) plus the evidenčné číslo of § 5(1)(h).
# In force from 1 November 2025 (as amended by 189/2025 Z. z.).
