# Zákon č. 452/2021 Z. z. o elektronických komunikáciách, § 109 ods. 8:
# Slovakia's ePrivacy transposition — the storage-and-access rule. Anyone who
# stores information in, or accesses information stored in, a user's terminal
# equipment may do so only with the user's provable consent meeting the
# requirements of the special regulation (the GDPR consent standard, per the
# provision's own footnote). The consent duty does not apply to criminal-
# procedure bodies and other state bodies, and technical storage/access is
# excepted where its sole purpose is the transmission of a message or it is
# strictly necessary for an expressly requested information-society service.
# The fragment is cut from the static.slov-lex.sk consolidated version
# (2026-08-18); footnote anchors are ignored. Slovak is the authentic
# language.
