# Obchodný zákonník (513/1991 Zb.), § 3a: Slovakia's company-law disclosure
# duty. § 3a(1) lists the data every entrepreneur must give on business
# documents (business name, seat or place of business, legal form of a legal
# person, IČO if assigned, register designation and entry number, and the
# paid-up share capital if capital is stated); § 3a(3) extends the same data
# to the entrepreneur's website. Earlier rounds recorded Slovakia as having
# no company-law website list — § 3a(3) is that list.
