# Zákon Národnej rady Slovenskej republiky č. 270/1995 Z. z. o štátnom
# jazyku Slovenskej republiky, § 8: the Slovak state-language duties that
# reach websites — (1) consumer information (product content labelling,
# instructions, warranty terms, other consumer information) must be in the
# state language within the scope of the special regulations; (5) in
# proceedings before public bodies contracts may also exist in another
# official EU language, but the Slovak version prevails on conflict;
# (6) signs, advertisements and notices intended to inform the public must
# be in the state language first; (7) exceptions (trade name, trade mark,
# registered names, names and surnames, established foreign expressions).
