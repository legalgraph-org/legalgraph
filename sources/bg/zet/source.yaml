# Закон за електронната търговия (ЗЕТ), ДВ бр. 51/23.06.2006: чл. 4 is the
# general information duty — the Bulgarian transposition of e-Commerce
# Directive 2000/31/EC Art. 5(1) (provider name, establishment address and
# management address, place-of-activity address, correspondence data including
# phone and e-mail, trade-register entry, supervisory body where a
# notification/registration/licensing regime applies, regulated-profession data,
# VAT-registration indication); чл. 4(2) is the price-transparency clause
# (Art. 5(2)). чл. 5(3) is the commercial-communication requirements clause —
# item 2 is the sender-identification duty. lex.bg injects the article text by
# script behind a session; tools/render renders it (make render-install once).
