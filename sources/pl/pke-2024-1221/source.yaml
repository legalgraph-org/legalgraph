# Ustawa z dnia 12 lipca 2024 r. — Prawo komunikacji elektronicznej (PKE),
# Dz. U. 2024 poz. 1221, in force 10 November 2024: art. 399 is the
# storage-and-access rule — Poland's transposition of ePrivacy Directive
# art. 5(3), replacing art. 173 of the repealed Prawo telekomunikacyjne
# (2002/2004). On the consent model: prior clear, easy and understandable
# information on the purpose of the storing/accessing and on the possibility
# to set conditions via software settings or service configuration, then
# consent (which may itself be expressed through those settings); ust. 3
# excepts transmission-only storage/access and access strictly necessary for
# an expressly requested telecom or e-service; ust. 4 covers installing or
# using software on the subscriber's or user's terminal equipment. ISAP serves
# the consolidated text as HTML through the official ELI API; one fragment per
# article is kept.
