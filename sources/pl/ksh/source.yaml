# Kodeks spółek handlowych (KSH), obwieszczenie Dz.U. 2024 poz. 18: the company-law
# website duties. Since the 13 October 2022 holding-company reform, commercial letters
# AND information on the company's websites must carry firm name, seat and address,
# the registry court and register number, NIP, and share capital (sp. z o.o. adds the
# unpaid-capital note for template-formed companies; SKA/PSA/SA add paid-in capital or
# the group-of-companies designation). ISAP serves the consolidated text as HTML
# through the official ELI API; one fragment per article is kept.
