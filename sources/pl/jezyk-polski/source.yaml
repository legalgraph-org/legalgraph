# Ustawa o języku polskim (Dz.U. 1999 nr 90 poz. 999, consolidated): art. 7
# requires Polish in legal transactions on the territory of Poland between
# Polish parties — expressly including the naming of goods and services,
# offers, advertising, manuals, information about properties, warranty terms,
# invoices and receipts. Foreign-language descriptions of goods/services and
# offers/advertising must simultaneously have a Polish version; exclusively
# foreign-language designations are prohibited (except proper names).
