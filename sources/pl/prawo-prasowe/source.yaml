# Prawo prasowe (Dz.U. 1984 nr 5 poz. 24, consolidated): the press-law imprint
# duty. Art. 7(2) defines "prasa" broadly — all mass-communication means
# including any medium created by technical progress that disseminates
# periodical publications — and art. 27 requires every copy/edition to show,
# in a visible and customary place, the publisher's name and address, the
# editorial office address and the editor-in-chief's name, place and date of
# publication. For online "prasa" the customary place is the site itself.
