# Ustawa o pozasądowym rozwiązywaniu sporów konsumenckich (Dz.U. 2016 poz.
# 1823): the Polish ADR act. Art. 31 obliges a trader who has committed to —
# or is legally required to — use consumer ADR to inform consumers about the
# competent ADR entity, including at least its website address, accessibly on
# the trader's own website (if it has one) and in contract templates it uses.
