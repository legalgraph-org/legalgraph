# Infoühiskonna teenuse seadus (Information Society Services Act, RT I
# 68/2001): § 4 is the provider-information duty — the Estonian transposition
# of e-Commerce Directive 2000/31/EC Art. 5. Lõige 1 is the catalogue
# (name/registry code/address/contact, registration or licence number, price
# references with tax and delivery costs, VAT number); lõige 2 the
# regulated-profession items. riigiteataja.ee is a JavaScript application;
# tools/render renders the consolidated act and waits for the § 4 text
# (make render-install once).
