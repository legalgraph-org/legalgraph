# Tarbijakaitseseadus (Consumer Protection Act, RT I 31.12.2015, 1): § 26 is
# the trader-information duty — contact details for complaints (lõige 1),
# notification of the recognised ADR body incl. its website address and
# procedure rules (lõige 2), display of that information on the trader's
# website and in its general terms where it has one (lõige 3), and the
# post-refusal durable-medium notice (lõige 4). Lõige 5 (ODR platform
# notice) is repealed in the current consolidation and lõige 6 is a savings
# clause; neither is sourced. riigiteataja.ee is a JavaScript application;
# tools/render renders the consolidated act and waits for the § 26 text
# (make render-install once).
