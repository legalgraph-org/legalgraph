<div class="act-part" data-type="loige" id="para26lg3">(3) Käesoleva paragrahvi lõigetes 1 ja 2 nimetatud teave esitatakse sõnaselgel, arusaadaval ja kergesti kättesaadaval viisil kaupleja veebilehel selle olemasolul ning vajaduse korral kaupleja ja tarbija vaheliste lepingute üld- või tüüptingimustes või kaupleja tegevuskohas.</div>
