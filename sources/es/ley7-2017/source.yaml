# Ley 7/2017, de 2 de noviembre, transposing the ADR Directive 2013/11/EU:
# art. 40 is the trader information duty — a trader adhered to or bound to use
# an accredited ADR entity must inform consumers, naming the entity and its
# website, clearly and accessibly on the trader's own website and in general
# contract terms (or other means if it has neither); art. 40(3) is the
# durable-medium pointer after a failed complaint and art. 40(4) the EU ODR
# platform link for online sellers.
