# BGH, Urteil vom 10.02.2011 — I ZR 164/09 (Double-opt-in-Verfahren, aka Telefonaktion II):
# consent under § 7(2) UWG is EU-law-compatible opt-in; but proof of consent needs the concrete
# declaration of every single consumer — stored and printable — so a confirmation mail in a
# double-opt-in procedure alone neither proves consent nor lightens the advertiser's burden.
# The authority for "double opt-in is how consent is evidenced, not evidence itself".
# ECLI:DE:BGH:2011:100211UIZR164.09.0. The PDF is the BGH's own publication.
