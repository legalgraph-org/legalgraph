# BGH, Urteil vom 09.09.2021 – I ZR 90/20 ("Influencer I", ECLI:DE:BGH:2021:090921UIZR90.20.0):
# an influencer's posts are geschäftliche Handlungen for her own business; a post about a third
# company's product without consideration is one for that company when it has a "werblicher
# Überschuss" — which a link to the manufacturer's page regularly supplies while "Tap Tags" alone
# do not; the § 5a(6) UWG label must be obvious at first glance and a hint in the post text does not
# label a "Tap Tag" on an image. The BGH publishes the decision as a PDF only; the file is kept
# whole and the passages the graph quotes are transcribed in schemas/law.xsd, checked word for word.
