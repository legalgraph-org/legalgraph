# OLG Frankfurt am Main, Urteil vom 18.02.2021 – 6 U 150/19
# (ECLI:DE:OLGHE:2021:0218.6U150.19.00): the Impressum of a US LLC with a
# Briefkastenadresse (postal box) was sufficient under § 5 Abs. 1 TMG — the
# provision asks for the address where the provider is established but not a
# physical business premises; its purpose is only to enable contact. The
# counterpoint to the "ladungsfähige Anschrift" standard of BGH V ZR 210/22.
