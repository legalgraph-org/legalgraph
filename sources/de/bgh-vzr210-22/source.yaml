# BGH, Urteil vom 7. Juli 2023 – V ZR 210/22: a proper action requires the plaintiff's
# serviceable address (ladungsfähige Anschrift); the address of a postal service provider
# that merely forwards mail is not one (ZPO § 253 Abs. 2 Nr. 1, § 130 Nr. 1, § 177).
# Not an Impressum decision — it decides § 253 ZPO — but it states the "ladungsfähig"
# standard that the § 5 DDG provider-address duty tracks. The BGH publishes the decision
# as a PDF only; the file is kept whole and the paragraphs the graph quotes are
# transcribed in schemas/law.xsd, checked word for word.
