# BGH, Urteil vom 20.07.2006 – I ZR 228/03 (NJW 2007, 310, "Anbieterkennzeichnung im
# Internet"): provider identification reachable through two clearly labelled links ("Kontakt"
# and "Impressum") can satisfy the "leicht erkennbar, unmittelbar erreichbar und ständig
# verfügbar" duty of § 6 TDG / § 10 Abs. 2 MDStV (predecessors of § 5 Abs. 1 DDG); two steps
# suffice for "unmittelbar erreichbar" and the information need not sit on the start page.
