# BGH, Urteil vom 09.09.2021 – I ZR 125/20 ("Influencer II", ECLI:DE:BGH:2021:090921UIZR125.20.0):
# the media-law provisions on commercial communication (§ 6 TMG, § 58 RStV, § 22 MStV — predecessors
# of § 6 DDG) are lex specialis not undermined by § 5a(6) UWG, and their "Gegenleistung" element
# covers advertising for third parties only, not an influencer's own promotion (Eigenwerbung).
