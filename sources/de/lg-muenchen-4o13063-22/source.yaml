# LG München I, Endurteil vom 30.03.2023 — 4 O 13063/22 (GRUR-RS 2023, 6354): dynamic Google-Fonts
# embedding transfers the visitor's IP address to Google in the US — potentially a violation of
# informational self-determination under GDPR, but a claim needs real personal affectedness;
# fear or unease alone is contested, and a claimant who does not even know which sites loaded
# the fonts in their name cannot claim harm. The counterpart to 3 O 17493/20 (which granted
# €100 damages). gesetze-bayern is JS-rendered; the page is a browser save.
