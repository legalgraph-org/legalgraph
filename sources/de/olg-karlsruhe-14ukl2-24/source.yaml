# Oberlandesgericht Karlsruhe, Urteil vom 03.03.2026 – 14 UKl 2/24
# (ECLI:DE:OLGKARL:2026:0303.14UKL2.24.00, "Pressetermine", GRUR 2026, 725): an automotive
# influencer's Instagram Reels are commercial communication for the car makers when vehicles were
# provided free for press events and travel costs reimbursed — consideration need not be a cash
# payment and no obligation to post is required; the posts were not clearly recognisable as
# advertising because the relevant audience includes non-followers reached through Instagram's
# recommendation algorithms (Rn. 42–54). Injunction plus €374.50 damages. The OLG provides
# decisions only on request; the full text was retrieved from nu:legal (Nulegal GmbH), which
# republishes official decisions — the decision itself is an official work under § 5 Abs. 1 UrhG.
