# Hanseatisches Oberlandesgericht Hamburg, Urteil vom 21.05.2026 – 15 U 99/24
# (ECLI:DE:OLGHH:2026:0521.15U99.24.00, NJRE001647569): a business Instagram account is a
# geschäftsmäßiger digitaler Dienst under § 5(1) DDG, and a highlighted link below the "Bio"
# to a webpage holding the full Impressum satisfies the duty — the average Instagram user
# expects to find it that way (citing BGH I ZR 228/03 and LG Trier 11 O 258/16). A merely
# temporary technical outage of the linked page is no breach of the "ständig verfügbar" duty
# (OLG Düsseldorf I-20 U 125/08). The commercial purpose of a post for the influencer's own
# products was evident without a separate label. Landesrecht Hamburg (juris) is a JS portal;
# the page is rendered and the article holding the decision text is kept, the paragraphs the
# graph quotes transcribed in schemas/law.xsd and checked word for word.
