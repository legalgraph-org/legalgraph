- id: oag-sephora-press-release
  title: "Attorney General Bonta Announces Settlement with Sephora as Part of Ongoing Enforcement of California Consumer Privacy Act"
  publisher: "California Attorney General"
  url: "https://oag.ca.gov/news/press-releases/attorney-general-bonta-announces-settlement-sephora-part-ongoing-enforcement"
  date: 2022-08-24
  why_link_only: "government press release; the filed judgment is stored as us-ca/ag-v-sephora — this page adds the enforcement context (first CCPA enforcement, GPC sweep) in the AG's own words"
  quote:
    text: "failed to process user requests to opt out of sale via user-enabled global privacy controls in violation of the CCPA, and that it did not cure these violations within the 30-day period currently allowed"
    locator: "second paragraph"
    language: en
  claim: "California AG v. Sephora (2022): $1.2m — the first CCPA enforcement action, for not honouring Global Privacy Control opt-out signals."
  supports: [US-CA-SFSC-2022-0824-sephora]
