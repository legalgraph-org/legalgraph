# Third-party pages the graph references without storing: the page is linked, the claim it
# backs is stated, and at most one short verbatim quote is kept. Official decisions are stored
# as sources; this list holds supporting material (press items, summaries) that adds context a
# primary source does not give. `legalgraph sources extract` turns it into lgo:ExternalReference.

- id: cnil-google-cookie-injunction-closure
  title: "Closure of the injunction issued against GOOGLE"
  publisher: "CNIL"
  url: "https://www.cnil.fr/en/closure-injunction-issued-against-google"
  date: 2023-07-13
  why_link_only: "official press item on cnil.fr; useful as the English-language account of SAN-2021-023 and its outcome, but not a normative text worth storing as an original"
  quote:
    text: "in addition to imposing a fine of 150 million euros, the CNIL's restricted committee ordered GOOGLE LLC and GOOGLE IRELAND LIMITED to allow users of the websites google.fr and youtube.com located in France to refuse the cookies placed on their terminal as easily as to accept them"
    locator: "second paragraph"
    language: en
  claim: "CNIL fined Google a total of €150m on 31 December 2021 (SAN-2021-023) for making cookies harder to refuse than to accept, and closed the injunction on 13 July 2023 after Google added an equally easy refusal button."
  supports: [FR-CNIL-SAN-2021-023]

