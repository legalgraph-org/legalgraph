# Malta's Companies Act (Cap. 386), article 6: the company-law website duty —
# business letters, order forms in any medium AND the internet website or
# websites of a commercial partnership must carry name, kind of partnership,
# registered office and registration number (art. 6(1)); Part XI overseas
# companies add constitution country, Malta branch address and winding-up
# (art. 6(2)); partnership-name and liquidator rules follow; art. 6(8) is the
# issued-plus-paid-up capital clause; art. 6(9)-(10) the penalty.
