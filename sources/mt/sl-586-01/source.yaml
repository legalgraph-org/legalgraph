# Malta's Processing of Personal Data (Electronic Communications Sector) Regulations
# (S.L. 586.01, Legal Notice 16 of 2003 as amended), regulation 5 "Access to information
# stored in terminal equipment": the ePrivacy Directive Article 5(3) transposition —
# storing or accessing information in a subscriber's or user's terminal equipment only with
# consent after clear and comprehensive information under article 19 of the Data Protection
# Act, with transmission-only and strictly-necessary exceptions. Legislation.mt publishes the
# consolidated regulations as PDF; the paragraphs the graph quotes are transcribed in
# schemas/law.xsd and checked letter for letter against the PDF's text.
