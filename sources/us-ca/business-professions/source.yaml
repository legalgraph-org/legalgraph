# Cal. Business & Professions Code — three blocks. § 17538(d): vendors doing business through the
# Internet or other electronic means must disclose, before accepting payment from a California
# buyer, their return and refund policy, legal name and complete street address — with rules for
# on-screen disclosure and a private-mailbox exception. §§ 22575–22579 (CalOPPA): every commercial
# website collecting personal information from California residents posts a privacy policy
# covering what is collected, how it is used, the change procedure and a do-not-track
# disclosure. § 17602 (automatic purchase renewals): clear renewal terms, affirmative consent,
# a retainable acknowledgment, pre-renewal notices, a cost-free cancellation mechanism — and
# termination online, at will. leginfo is behind Incapsula; the pages are browser-saved print
# views, and the § 17538(d) fragment is cut from the Wayback Machine capture of the official page
# of 2026-10-03.
