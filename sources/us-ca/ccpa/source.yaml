# California Consumer Privacy Act of 2018, as amended by the California Privacy Rights Act (Civil Code
# §§ 1798.100 et seq.): the official text is the Legislature's own leginfo.legislature.ca.gov, one HTML
# page per section. leginfo refuses automated downloads, so the pages are saved by hand and brought in
# with `legalgraph sources fetch --saved <file>`; each section's fragment (div#codeLawSectionNoHead) is
# kept and the sections the graph quotes are transcribed in schemas/law.xsd and checked word for word
# against it. The CPPA's consolidated statute PDF is kept as a second official copy — note it carries
# editorial asterisks where § 1798.199.95(d) inflation-adjusted the dollar figures, marks the code text
# does not have.
