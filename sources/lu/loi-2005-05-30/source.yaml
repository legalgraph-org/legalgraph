# Loi modifiée du 30 mai 2005 concernant la protection de la vie privée dans
# le secteur des communications électroniques: art. 4, paragraphe (3), point e)
# is the storage-and-access rule — the Luxembourg transposition of ePrivacy
# Directive art. 5(3), on the consent model ("donné son accord" after clear
# and complete information; CNPD reads the RGPD consent standard into it).
# The point also carries the transmission-only and strictly-necessary
# exceptions. legilux.public.lu builds the consolidated text with Angular;
# tools/render renders it (make render-install once).
