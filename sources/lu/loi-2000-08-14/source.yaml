# Loi du 14 août 2000 relative au commerce électronique: art. 5 is the general
# information duty — the Luxembourg transposition of e-Commerce Directive
# 2000/31/EC Art. 5 (provider name, geographic address, rapid direct effective
# contact including e-mail, register/VAT numbers and authorisation with the
# granting authority's details, regulated-profession data, and price
# transparency). Note: the workplan cited "art. 4"; art. 4 is the freedom-of-
# establishment/access rule. Art. 5 is the information duty. legilux.public.lu
