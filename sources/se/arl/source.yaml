# Lag (2015:671) om alternativ tvistlösning i konsumentförhållanden: the
# Swedish ADR act. 10 § requires a trader committed to ADR to inform consumers
# clearly and accessibly on any consumer-facing websites and in written
# contract terms, including the ADR body's web and postal address; 11 § is
# the durable-medium pointer when a consumer's claim is rejected; 12 § points
# to Art. 14 of the EU ODR Regulation.
