# Aktiebolagslagen (2005:551) 28 kap. 5 §: the Swedish company-law website
# duty — an aktiebolag's brev, fakturor, orderblanketter och webbplatser must
# show företagsnamn, the municipality where the board has its seat, and the
# organisationsnummer, plus the liquidation fact where applicable; paragraph 2
# lets Bolagsverket permit an AB to withhold its name from its websites and
# show only the company type instead. The section is cut from the Riksdag
# consolidated SFS text (current wording since lag 2018:1682).
