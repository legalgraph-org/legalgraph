# Lag (2022:482) om elektronisk kommunikation (LEK): 9 kap. 28 § is the
# storage-and-access rule — Sweden's transposition of ePrivacy Directive
# art. 5(3), on the consent model. The provision does not use the word
# "cookie": it covers any data stored in or retrieved from a subscriber's or
# user's terminal equipment, with information about the purpose of the
# processing and consent having the meaning they have in the GDPR (1 kap.
# 8 §); the second paragraph excepts transmission-only storage/access and
# access strictly necessary for a service at the user's or subscriber's
# express request. LEK replaced lag (2003:389) on 3 June 2022.
