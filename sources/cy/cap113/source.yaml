# Ο περί Εταιρειών Νόμος (ΚΕΦ.113) — Cyprus's Companies Law. Άρθρο 103 is the
# business-documents disclosure duty; εδάφιο (1Α) extends items (i)–(vi) of
# παράγραφος (γ) verbatim to a company's website (διαδικτυακός τόπος), and (5)
# makes a website without them an offence. The consolidated text on cylaw.org
# (the Cyprus Bar Association's legislation service) serves each article in its
# own section page; the fragment holding άρθρο 103 is kept verbatim.
