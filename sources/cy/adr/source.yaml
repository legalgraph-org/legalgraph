# Ο περί της Εναλλακτικής Επίλυσης Καταναλωτικών Διαφορών Νόμος του 2017
# (85(I)/2017), άρθρο 14: the Cypriot trader ADR information duty —
# Directive 2013/11 Art. 13 transposition in full: (1) ADR entities + their
# website address for traders committed to or obliged to use them; (2)
# clear, comprehensible and easily accessible provision on the trader's
# website and, where applicable, in general terms and conditions;
# (3) the after-complaint duty on paper or another durable medium; (4)
# applied in addition to Regulation 524/2013 art. 14.
