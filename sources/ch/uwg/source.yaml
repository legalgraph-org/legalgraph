# Swiss Federal Act on Unfair Competition (Bundesgesetz gegen den unlauteren Wettbewerb,
# UWG; SR 241), consolidated version of 1 January 2025: official Akoma Ntoso XML from Fedlex,
# the Federal Chancellery's publication platform. German, French and Italian are authentic;
# German is annotated. The English text is Fedlex's translation, published for information
# only (authentic: false), kept as a parallel version. Art. 3 Abs. 1 lit. s makes it unfair
# to offer goods, works or services in electronic commerce without clear and complete
# identity/contact details (including email), without indicating the technical steps to
# contract conclusion, without appropriate means to recognise and correct input errors, and
# without confirming the customer's order immediately by electronic means.
