# official XML (Crown Legislation Markup Language). Section 62 makes an unfair consumer term
# unenforceable, section 68 requires transparent terms (plain intelligible language, prominence,
# contra proferentem), and Schedule 2 is the indicative grey list — the UK counterpart of the
# EU's Unfair Terms Directive for website terms.
