# Wetboek van vennootschappen en verenigingen (WVV/CSA), wet van 23 maart 2019.
# Art. 2:20 is the company-law disclosure duty: every deed, invoice, letter,
# order form, WEBSITE and other document of a legal person must carry its name,
# legal form, seat, enterprise number, "rechtspersonenregister"/RPR + the court
# of the seat, and where applicable its e-mail address, website and liquidation
# status. Art. 2:21 is the capital-on-websites rule for NV/SE/SCE; art. 2:22 the
# personal-liability clause. The consolidated text is served by Justel; the
# fragment between the Art.2:20 and Art.2:22/1 anchors is kept verbatim
# (re-encoded to UTF-8: the page serves windows-1252).
