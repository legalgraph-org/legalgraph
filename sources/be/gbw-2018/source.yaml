# Wet van 30 juli 2018 betreffende de bescherming van natuurlijke personen met
# betrekking tot de verwerking van persoonsgegevens (the Belgian GDPR framework
# law, "Kaderwet"), art. 10/2: Belgium's cookie rule, Belgium's transposition of
# ePrivacy Directive Art. 5(3). Inserted by art. 256 of the Wet van 21 december
# 2021 (in force 10-01-2022), which repealed the former art. 129 of the Wet van
# 13 juni 2005 betreffende de elektronische communicatie (WEC); supervision moved
# from the BIPT to the Gegevensbeschermingsautoriteit (GBA). Storage of or access
# to information on the terminal equipment of a subscriber or user is allowed only
# on condition that the person concerned receives clear and precise information
# about the purposes of the processing and his rights, and has given consent after
# being informed; the first paragraph does not apply to technical storage or
# access solely to carry out the transmission of a communication over an
# electronic-communications network or to provide an explicitly requested service
# where strictly necessary. Justel serves the consolidated law as one page with
# flat <A NAME='Art.…'> anchors, so the fragment holding art. 10/2 is kept
# verbatim (Dutch version).
