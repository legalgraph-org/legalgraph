# Codice del consumo (D.Lgs. 6 settembre 2005, n. 206), Titolo II-bis: art.
# 141-sexies is the trader-information duty — the Italian transposition of
# Directive 2013/11/EU Art. 13. Comma 1 defines the information (the ADR
# organism(s) and their website address) for traders committed to ADR; comma 2
# requires it clearly and accessibly on the trader's website and in the general
# contract terms; comma 3 the post-complaint durable-medium duty. The workplan
# said "art. 141-ter" — that article governs parity-negotiation procedures;
# the information duty is 141-sexies. normattiva.it serves article-level pages
# under ~artN URNs; tools/render renders them (make render-install once).
