# Codice in materia di protezione dei dati personali (D.Lgs. 196/2003), Art. 122: the Italian
# cookie rule, implementing Article 5(3) ePrivacy. Normattiva serves the consolidated text as
# HTML only; the fragment holding Article 122 is kept and the text is transcribed in
# schemas/law.xsd, checked word for word against it. Comma 1 (informed consent and the technical
# exceptions), comma 2 (consent may be given through browser or device settings) and comma 2-bis
# (the prohibition on accessing stored information) are all in force.
