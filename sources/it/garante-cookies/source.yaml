# Garante per la protezione dei dati personali, Provvedimento n. 231 del 10 giugno 2021,
# "Linee guida cookie e altri strumenti di tracciamento", published in Gazzetta Ufficiale
# Serie generale n. 163 del 9 luglio 2021 (the whole issue is kept as original): Italy's
# cookie guidance — consent via a positive act, scrolling is never consent, the cookie
# wall is unlawful without an equivalent content/service alternative, excessive banner
# re-proposal undermines freedom of consent, and legitimate interest cannot justify
# cookies or other tracking tools. The paragraphs the graph quotes are transcribed in
# schemas/law.xsd and checked letter for letter against the PDF's text.
