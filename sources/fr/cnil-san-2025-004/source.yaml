# CNIL délibération SAN-2025-004 du 1er septembre 2025 (restricted committee): ads displayed
# between Gmail messages without consent (art. L. 34-5 CPCE) and trackers set at Google-account
# creation without valid consent (loi 78-17 art. 82, read with the GDPR). Two fines totalling
# €325m — Google LLC €200m, Google Ireland Limited €125m — plus an injunction. The French
# decision is on legifrance (CNILTEXT000052182222, (stored here); the CNIL's own English
# courtesy translation is stored here as a non-authentic version — the French text prevails.
