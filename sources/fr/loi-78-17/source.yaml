# Loi n° 78-17 du 6 janvier 1978 relative à l'informatique, aux fichiers et aux libertés, art. 82
# (consolidated version): every subscriber or user of electronic-communications services must be
# informed and must consent before information is stored on or read from their terminal — the
# national rule every CNIL cookie sanction rests on (SAN-2021-023/024, SAN-2025-004/005), and the
# French transposition of ePrivacy art. 5(3). legifrance needs a browser; the fragment is the
# saved code page's article.
