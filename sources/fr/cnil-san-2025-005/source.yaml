# CNIL délibération SAN-2025-005 du 1er septembre 2025 (restricted committee): INFINITE STYLES
# SERVICES CO. LIMITED (the SHEIN group) deposited advertising cookies before consent, ignored
# users' refusals and informed them poorly (loi 78-17 art. 82). A €150m fine. The French decision
# is in legifrance's CNIL collection (CNILTEXT id to be confirmed on save); the CNIL's own
# English courtesy translation is stored here — the French text prevails.
