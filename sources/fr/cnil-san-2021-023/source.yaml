# CNIL délibération SAN-2021-023 du 31 décembre 2021 (restricted committee): two websites let
# users accept cookies in one click but made them refuse through several clicks — consent not
# free (loi 78-17 art. 82, read with the GDPR). Fines of €90m on [X] and €60m on [Y], plus an
# injunction with €100,000/day astreinte. Légifrance anonymised the parties two years after
# publication, as the decision provides; the graph keeps them masked and links the archived
# January 2022 publication (sources/link-only.yaml), where anyone can verify who they are.
# legifrance needs a browser; the fragment is the saved deliberation page's .cnil container.
