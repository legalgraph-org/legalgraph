# Código das Sociedades Comerciais (Decreto-Lei n.º 262/86), artigo 171.º
# "Menções em actos externos": the Portuguese company-law disclosure duty.
# N.º 1 lists firma, tipo, sede, conservatória do registo, matrícula and
# NIPC, and liquidation where applicable, on contracts, correspondence,
# publications, advertisements AND sítios na Internet; n.º 2 is the capital
# clause for quotas/SA/comandita companies; n.º 3 covers foreign branches.
