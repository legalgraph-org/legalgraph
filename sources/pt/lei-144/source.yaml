# Lei n.º 144/2015, de 8 de setembro: the Portuguese ADR framework. Art. 18
# transposes Art. 13 of the ADR Directive 2013/11/EU — suppliers of goods or
# services established in Portugal who are bound to an ADR entity (by adhesion
# or by mandatory arbitration) must inform consumers of that entity and its
# website, clearly and accessibly on their own website where it exists, and
# in written or adhesion contracts or another durable medium.
