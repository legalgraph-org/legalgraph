# Children's Online Privacy Protection Rule (16 CFR Part 312): the official annual edition of the
# Code of Federal Regulations (revised as of 1 January 2026, carrying the 2025 amendments) in its
# XML from govinfo.gov. § 312.4 requires the online notice — a prominent link to a children's
# privacy policy on the home or landing page and where data is collected — and § 312.6 requires
# verifiable parental consent before collecting children's personal information.
