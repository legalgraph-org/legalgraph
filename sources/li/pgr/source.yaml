# Personen- und Gesellschaftsrecht (PGR), LGBl. 1926 Nr. 4, Art. 120a: the
# Liechtenstein company-law disclosure duty (Umsetzung of the Publizitäts-
# richtlinien 68/151/EWG, 2003/58/EG). Briefe, Bestellscheine and Webseiten
# of an AG, KGaA or GmbH must show firma+Rechtsform, statutarischer Sitz,
# Liquidation, the register identification and the register number; Abs. 2 is
# the paid-in capital clause; Abs. 3 covers foreign-seated branches. Lilex
# publishes the consolidated act as PDF; each quoted line is checked letter
# for letter against it (PDF compare is on letters only).
