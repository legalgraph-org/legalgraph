# Gesetz über alternative Streitbeilegung in Konsumentenangelegenheiten
# (AStG; LGBl. 2016 Nr. 516): Art. 18 is the trader-information duty — the
# entrepreneur must inform consumers of the ADR body or bodies covering it,
# including the body's website address, and Abs. 2 requires the information
# on the trader's website and in its general terms where it has one — the
# Liechtenstein ADR website duty (L4). gesetze.li serves the consolidated
