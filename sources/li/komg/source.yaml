# Gesetz vom 5. April 2023 über die elektronische Kommunikation (Kommunikationsgesetz;
# KomG, LGBl. 2023 Nr. 216): Liechtenstein's electronic-communications act. Art. 61
# Abs. 4 — introduced by the KomG revision in force 01.02.2025 — is the storage-and-
# access rule, the transposition of ePrivacy Directive 2002/58/EC Art. 5(3): storing
# information on, or accessing information stored on, a user's terminal equipment only
# with the user's consent on the basis of clear and comprehensive information, given
# and constituted under the GDPR (Verordnung (EU) 2016/679), with exceptions for
# transmission-only storage/access and storage/access strictly necessary for an
# audiovisual media service explicitly requested by the user — the published text says
# "audiovisuellen Mediendienst", not "information-society service"; the Datenschutzstelle
# Liechtenstein reads it as the ePrivacy concept. gesetze.li (Lilex) serves the
# consolidated act as PDF in the version of 01.02.2025; the paragraph the graph quotes
# is transcribed in schemas/law.xsd and checked letter for letter against the PDF's
# text.
