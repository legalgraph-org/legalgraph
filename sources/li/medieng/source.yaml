# Mediengesetz (MedienG), LGBl. 2005 Nr. 250, LR-Nr. 449.1, Art. 11 and
# Art. 12: the Liechtenstein media imprint and ownership-disclosure duty.
# "Medium" covers electronic media, so news websites are covered: Art. 11
# requires the owner's name/firm and editorial seat (plus address,
# electronic contact data, publisher details and regulators for periodical
# media); Art. 12 requires the ownership/editorial-line data to be kept
# constantly easily and directly accessible in the medium itself.
