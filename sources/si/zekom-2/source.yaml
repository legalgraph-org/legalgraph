# Zakon o elektronskih komunikacijah (ZEKom-2, Ur. l. RS 130/22): 225. člen
# ("piškotki") is the storage-and-access rule — the Slovenian transposition of
# ePrivacy Directive art. 5(3), on the consent model ("privolitev"). Odstavek 1
# consent after clear and exhaustive information about the controller and the
# purposes of processing under the personal-data-protection rules; odstavek 2
# the transmission-only and strictly-necessary exceptions; odstavek 3 consent
# via browser settings or other applications counting as personal consent;
# odstavek 4 the data-protection-law provisions prevailing in case of
# overlapping breach; odstavek 5 the Information Commissioner's inspection
# competence. pisrs.si is a JavaScript application; its machine-readable
# consolidated text (neprečiščeno besedilo NPB2, datoteke/integracije) serves
# the same words as static PDF and is fetched directly.
