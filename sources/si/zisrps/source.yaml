# Zakon o izvensodnem reševanju potrošniških sporov (ZIsRPS, Ur. l. RS 81/15,
# in force 13.11.2015): 32. člen is the trader-information duty — the
# Slovenian transposition of Directive 2013/11/EU Art. 13 and the ODR
# Regulation 524/2013 link duty. Odstavek 1 the pre-contract website and
# general-terms notice naming the recognised ADR body with its firm, e-mail
# and phone; odstavek 2 the post-refusal durable-medium notice; odstavek 3
# the warning when the trader recognises no ADR body; odstavek 4 the
# electronic link to the EU ODR platform for online sellers. The original is
# the official gazette PDF served by pisrs.si's datoteke/integracije endpoint
# (the act was never amended, so the original text is the current text);
# pisrs.si's reader is JavaScript-only, but its API serves the same official
# file as PDF.
