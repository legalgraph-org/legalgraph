# Zakon o elektronskem poslovanju na trgu (ZEPT, Ur. l. RS 96/09): 5. člen is
# the provider-information duty — the Slovenian transposition of e-Commerce
# Directive 2000/31/EC Art. 5. Odstavek 1 is the catalogue on the provider's
# websites, odstavek 2 the links-on-the-main-page mechanism, odstavek 3 the
# price clause. pisrs.si is a JavaScript application whose data API needs a
# browser user agent; the portal's own machine-readable consolidated text
# (neprečiščeno besedilo NPB7, datoteke/integracije) serves the same words as
# static HTML and is fetched directly.
