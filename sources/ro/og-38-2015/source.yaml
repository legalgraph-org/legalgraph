# Ordonanța Guvernului nr. 38 din 26 august 2015 (Monitorul Oficial nr. 654
# din 28 august 2015), transposing Directive 2013/11/EU on alternative dispute
# resolution: art. 25 is the trader-information duty — alin. (1) defines the
# information (the ADR entity/entities and their website address), alin. (2)
# requires it on the trader's website where one exists and in the general
# terms of sales/service contracts, alin. (3) the post-complaint durable-medium
# duty. The print view (DetaliiDocumentAfis) of legislatie.just.ro serves the
# consolidated text but rejects plain HTTP clients; tools/render renders it
# (make render-install once).
