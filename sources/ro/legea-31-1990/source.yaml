# Legea nr. 31 din 16 noiembrie 1990 (Legea societăților): art. 74 requires a
# company to state its name, legal form, seat and unique registration code on
# any invoice, offer, order, price list, prospectus or other document used in
# commerce emanating from it, and alin. (5) extends the same information to the
# company's own website — the Romanian company-law website duty (L3). The
# consolidated view (DetaliiDocument) of legislatie.just.ro serves the current
# text; the print view (DetaliiDocumentAfis) serves the unamended original and
# rejects plain HTTP clients, so tools/render renders the consolidated page
# (make render-install once).
