# Legea nr. 365 din 7 iunie 2002 privind comerţul electronic: Romania's e-commerce act.
# Articolul 5 is the provider-information duty (e-Commerce Directive art. 5) — wider than the
# Directive: it adds phone and fax numbers and the fiscal registration code. legislatie.just.ro
# serves the consolidated text (forma consolidată) on its main view (DetaliiDocument); the
# print view (DetaliiDocumentAfis) serves the act as originally adopted and must not be used
# for current-law checks. Alin. (3) was added by Legea nr. 50/2024. The fragment holding
# articolul 5 is kept and the text is transcribed in schemas/law.xsd, checked word for word
# against it.
