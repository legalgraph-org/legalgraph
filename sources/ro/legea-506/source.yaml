# Legea nr. 506 din 17 noiembrie 2004 privind prelucrarea datelor cu caracter
# personal şi protecţia vieţii private în sectorul comunicaţiilor electronice:
# Romania's ePrivacy-sector act. Articolul 4 alin. (5), (5¹)–(6) is the storage-
# and-access rule (ePrivacy Directive art. 5(3) transposition) as amended by
# OUG nr. 13/2012: consent (acordul), GDPR-style information, consent via
# browser settings, plus the transmission/strictly-necessary exceptions.
# legislatie.just.ro serves the consolidated text (forma consolidată) on its
# main view (DetaliiDocument); the print view (DetaliiDocumentAfis) serves the
# act as originally adopted and must not be used for current-law checks. The
# fragment holding articolul 4 is kept and the text is transcribed in
# schemas/law.xsd, checked word for word against it.
