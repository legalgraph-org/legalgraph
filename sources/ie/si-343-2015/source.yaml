# S.I. No. 343/2015 — European Union (Alternative Dispute Resolution for
# Consumer Disputes) Regulations 2015: reg. 18 is the trader information duty
# transposing Art. 13 of the ADR Directive — a trader committed or obliged to
# use ADR must name the ADR entity with its website address on the trader's
# own website (where one exists) and in general terms and conditions; reg.
# 18(3)–(4) is the durable-medium pointer after a failed complaint, and (5)–(6)
# make breach a summary offence.
