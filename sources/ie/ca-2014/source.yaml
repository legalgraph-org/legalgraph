# Companies Act 2014, section 151: the Irish company-law disclosure duty.
# Business letters and order forms must carry name and legal form, place of
# registration and number, and registered office; a referenced share capital
# must be the issued paid-up capital. Subsection (4) is the website duty —
# the same particulars prominently on any company website. The fragment is
# cut from the section page on irishstatutebook.ie.
