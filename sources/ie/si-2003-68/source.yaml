# European Communities (Directive 2000/31/EC) Regulations 2003 (S.I. No. 68/2003):
# Ireland's transposition of the e-Commerce Directive. Regulation 7 is the
# provider-information duty; item (d) goes beyond the Directive — the website must
# prominently show how natural persons can register their choice about unsolicited
# commercial communications. The Irish Statute Book print view is a flat table with
# no per-article wrapper, so the fragment holding regulation 7 is kept verbatim.
