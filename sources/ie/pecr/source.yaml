# S.I. No. 336 of 2011 (Privacy and Electronic Communications Regulations): the Irish cookie rule.
# Regulation 5(3) requires consent plus clear comprehensive information for storage or access on
# terminal equipment, (4) lets consent come through browser settings, (5) keeps the technical
# exceptions — the Irish transposition of Article 5(3) ePrivacy. The Irish Statute Book serves the
# text as HTML; the fragment holding the instrument is kept and the text is transcribed in
# schemas/law.xsd, checked word for word against it.
