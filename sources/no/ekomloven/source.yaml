# Lov om elektronisk kommunikasjon (ekomloven), Lov 13.12.2024 nr. 76, in
# force 01.01.2025: Norway's electronic-communications act implementing the
# EU Electronic Communications Code. § 3-15 is the storage-and-access rule —
# the transposition of ePrivacy Directive 2002/58/EC Art. 5(3) as amended:
# consent meeting the GDPR consent standard plus information on the data,
# the purpose and the controller, and the transmission/strictly-necessary
# exceptions in annet ledd. It replaced the old § 2-7 b rule under which
# browser defaults could count as consent. Lovdata serves the act's official
# text; the per-section fragment is kept and the text is transcribed in
# schemas/law.xsd, checked word for word against it.
