# Lov 20. juni 2025 nr. 106 om Foretaksregisteret (foretaksregisterloven):
# § 7-2 is the Norwegian company-law website identification duty — every
# enterprise's nettsider, brev og forretningsdokumenter must carry
# organisasjonsnummer and foretaksnavn/navn (ledd 1; MVA marking only on
# salgsdokumenter); AS/ASA must also show register, organisasjonsform,
# hovedkontor and any under-avvikling status (ledd 2). In force 1 January
# 2026 (res. 20 juni 2025 nr. 1119); it replaced the 1985 register act.
# Lovdata serves the section page; the #PARAGRAF_7-2 fragment is kept.
