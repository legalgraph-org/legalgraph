# Lov om redaksjonell uavhengighet og ansvar i redaktørstyrte journalistiske
# medier (medieansvarsloven, lov 2020-05-29-59), § 5: the editor's
# information duty for media covered by the act — media that regularly
# produce and publish journalism, current-affairs material, public debate
# or other content of general interest, which includes news websites.
# (1) states who the editor is in the medium; (2) gives media users access
# to the medium's name, address, email address and other details enabling
# direct contact.
