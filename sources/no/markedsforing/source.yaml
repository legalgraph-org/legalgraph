# Markedsføringsloven § 10 a: the Norwegian trader ADR information duty —
# Directive 2013/11 Art. 13 transposition (the ADR directive was
# incorporated via the EEA agreement and implemented in the Marketing Act,
# not a standalone act). First ledd: clear and understandable information
# about registered complaint bodies (godkjenningsloven § 25 list) with
# their websites, at minimum in general contract terms and on the trader's
# own website, easily accessible. Second ledd: the after-complaint duty —
# when a dispute arises and the parties cannot settle amicably, the first
# ledd information is given in writing or on another durable medium.
