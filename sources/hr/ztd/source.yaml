# Zakon o trgovačkim društvima (NN 111/93, pročišćeni NN 152/2011): the Croatian
# Companies Act. Članak 21 st. 4–6 is the business-paper/website disclosure duty:
# "Isto vrijedi i za sadržaj internetske stranice društva." Narodne novine serves
# the 2011 official consolidated text as a flat Word-export page; članak 21 was
# cut between its own heading and Članak 22. Stavci 4–6 are verbatim in the
# current consolidation (st. 1 alone changed "sudski"→"trgovački" register in
# later amendments); amendment notes printed inside the stavke are retained in
# the fragment.
