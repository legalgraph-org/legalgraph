# Zakon o alternativnom rješavanju potrošačkih sporova (NN 121/2016):
# članak 22 is the trader-information duty — traders committed to or obliged
# to use ADR bodies must inform consumers, and stavak 3 requires the notice
# on the trader's website, in its business premises and by other means. The
