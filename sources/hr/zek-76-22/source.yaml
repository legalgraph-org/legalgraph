# Zakon o elektroničkim komunikacijama (ZEK), Narodne novine 76/2022 (in force
# 12 July 2022, replacing the 2008 act): članak 43. stavak 4 is the
# storage-and-access rule — Croatia's transposition of ePrivacy Directive
# art. 5(3), on the consent model ("privola"), with clear and complete
# information under the personal-data-protection rules, inter alia on the
# purposes of processing; the same paragraph excepts transmission-only
# storage/access and access strictly necessary for an expressly requested
# information-society service. Subsequent amendments (NN 14/24 — cybersecurity
# law repealing art. 41 — and NN 45/2026) do not touch članak 43. narodne-
# novine.nn.hr serves the gazette text directly.
