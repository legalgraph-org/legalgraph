# Ontario Consumer Protection Act, 2002 (S.O. 2002, c. 30, Sched. A), Part IV ss. 38-40 on
# internet agreements: disclose the prescribed information before the consumer enters, give an
# express opportunity to accept, decline and correct errors, make the disclosure retainable and
# printable, deliver a written copy, or the consumer may cancel within 7 days (30 days where the
# copy is missing). e-Laws serves the consolidated act as HTML; the fragment holding the statute
# is kept and the text is transcribed in schemas/law.xsd, checked word for word against it.
