# Νόμος 3471/2006 (ΦΕΚ Α' 133/28.06.2006), «Προστασία δεδομένων προσωπικού
# χαρακτήρα και της ιδιωτικής ζωής στον τομέα των ηλεκτρονικών επικοινωνιών»:
# Greece's ePrivacy-sector act (transposes Directive 2002/58/EC). Άρθρο 4
# παρ. 5 is the storage-and-access rule — as originally adopted it prohibited
# storage and access outright, apart from transmission and what a requested
# service strictly needs; art. 170 of Ν.
# 4070/2012 (ΦΕΚ Α' 82/2012) replaced παρ. 5 with the current consent rule:
# consent (συγκατάθεση) after clear and extensive information per art. 11(1)
# of Ν. 2472/1997, consent possible via browser settings, plus the
# transmission and strictly-necessary exceptions in the same paragraph. The
# annotated words are the replacement text published in ΦΕΚ Α' 82/2012; the
# 133/2006 issue is kept as the act's original publication. et.gr serves
# Gazette issues as PDFs without a consolidated text; both PDFs carry proper
# Unicode maps (no pdf_encoding needed, unlike ΦΕΚ Α' 116/2003).
