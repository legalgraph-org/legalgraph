# Lov om tjenester i informationssamfundet (E-handelsloven), lov nr 227 af
# 22/04/2002: § 7 is the general information duty — the Danish transposition of
# e-Commerce Directive 2000/31/EC Art. 5 (provider name, physical address of
# establishment, e-mail/postal address and other rapid direct effective contact
# details, CVR number where registered, approval-scheme membership and the
# supervisory authority; regulated-profession data in stk. 2; permanent easy
# access in stk. 3). § 8 is the price-transparency clause (Art. 5(2)).
