# Закон України «Про забезпечення функціонування української мови як державної» (No. 2704-VIII): published by
# the Verkhovna Rada on zakon.rada.gov.ua as HTML only. The fragment holding the law text (div#article) is
# kept; the articles the graph uses are transcribed in schemas/law.xsd and checked word for word against it.
# Article 27(6) requires websites of businesses registered in Ukraine to be in Ukrainian (loading it by
# default), 27(7) does the same for mobile apps, and Article 30 requires consumer information, including in
# online shops, in Ukrainian. The portal blocks quick successive requests and foreign traffic: `pause` spaces
# out downloads, which may need a Ukrainian network — or save the page by hand and run `legalgraph sources
# fetch --saved <file>`. The English original is the Rada's official translation for information (last
# modified 13.05.2021); `verify` refuses provisions the portal's own notes show as amended after that
# (Article 27(6) was rewritten by the Media Law in 2022, so it gets a machine translation instead).
