# act (ua/consumer-rights) takes effect. Published by the Verkhovna Rada on zakon.rada.gov.ua as HTML only. The
# fragment holding the law text (div#article) is kept; the articles the graph uses are transcribed in
# schemas/law.xsd and checked word for word against it. Article 13 covers distance contracts: pre-contract
# information (part 2) and the 14-day right to terminate (part 4). The portal blocks quick successive requests
# and foreign traffic: `pause` spaces out downloads, which may need a Ukrainian network — or save the page by
# hand and run `legalgraph sources fetch --saved <file>`. The English original is the Rada's official
# translation for information (last modified 12.05.2021); `verify` refuses provisions the portal's own notes
# show as amended after that (part 2's item 7 was rewritten in 2022, so it gets a machine translation instead).
