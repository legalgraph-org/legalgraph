# Quebec Consumer Protection Act, CQLR c. P-40.1, s. 54.4: before a distance contract is entered
# into, the merchant must disclose its name and other business names, address, telephone, fax and
# technological address, a detailed description of the goods or services, prices and charges,
# total amount and payment terms, performance date, delivery details and cancellation, rescission,
# return, exchange and refund conditions — presented prominently and, for a written offer,
# retainable and printable. Légis Québec serves the consolidated act as a client-side
# application; the fragments are cut from Wayback Machine captures of the French page of
# 2025-11-07 (authentic) and the English page of 2025-10-12 (the Éditeur officiel's translation,
# non-authentic parallel). French prevails under the Charter of the French language.
