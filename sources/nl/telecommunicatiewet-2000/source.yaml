# Telecommunicatiewet (Stb. 1998, 610), art. 11.7a: the Dutch cookie rule —
# Netherlands' transposition of ePrivacy Directive Art. 5(3). Storing information
# on, or gaining access to information already stored in, a user's terminal
# equipment via an electronic communications network is allowed only if the user
# has been given clear and complete information (at least about the purposes)
# and has given consent; lid 2 extends the requirement to equivalent access not
# via the network; lid 3 is the transmission/strictly-necessary exception
# (plus a de-minimis alternative for quality/effectiveness data with no or minor
# privacy impact); lid 4 presumes personal-data processing where data is
# collected, combined or analysed across information-society services to treat
# the user differently; lid 5 bars public-law service providers from conditioning
# access to their service on that consent. wetten.overheid.nl rejects plain
# HTTP clients; tools/render renders the article page (make render-install once).
