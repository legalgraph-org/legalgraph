# Handelsregisterwet 2007, art. 27: undertakings and legal persons entered in
# the trade register must state their registration number on all letters,
# orders, invoices, offers and other announcements issued by them, except
# advertisements — the Dutch KvK-number duty. Whether "andere
# aankondigingen" reaches a company website is for review; the express
# website duty is Burgerlijk Wetboek art. 3:15d(1)(c), sourced under
# nl/bw-boek3. wetten.overheid.nl rejects plain HTTP clients; tools/render
# renders the article page (make render-install once).
