# § 14 UGB (Unternehmensgesetzgebuch): the Austrian imprint duty for companies registered in the
# Firmenbuch — Firma, Rechtsform, Sitz, Firmenbuchnummer, winding-up and Firmenbuchgericht on
# business letters, order forms and websites, plus capital details where capital is stated.
