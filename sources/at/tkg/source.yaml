# Telekommunikationsgesetz 2021 (TKG 2021): the authentic Bundesgesetzblatt XML from the Austrian
# Legal Information System (RIS). § 165(3) is the Austrian cookie rule: providers of information-
# society services must tell the user which personal data they process, on what legal basis, for
# which purposes and for how long, and may collect it only with the user's active consent on clear
# and comprehensive information; the technical-necessity exception follows. Checked against the
# consolidated text (Fassung vom 02.11.2026): § 165(3) is in force unchanged.
