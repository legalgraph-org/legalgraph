# Alternative-Streitbeilegung-Gesetz (BGBl. I Nr. 105/2015, konsolidiert):
# § 19 is the Austrian ADR information duty implementing Art. 13 of the ADR
# Directive 2013/11/EU. A trader who is committed or obliged to use consumer
# ADR must name the competent ADR body (AS-Stelle) with its website address,
# on the trader's own website (where it has one) and in its terms and
# conditions. Abs. 3 adds the paper/durable-medium pointer when no settlement
# is reached.
